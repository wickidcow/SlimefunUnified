name: Unified pinned-source experimental JAR
on:
  push:
    paths:
      - 'upstream/**'
      - 'scripts/**'
      - 'src/**'
      - 'overlay/**'
      - 'LICENSE'
      - '.github/workflows/unified-core-prototype.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prototype-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate policy separately
        run: bash scripts/test.sh
      - name: Assemble pinned Slimefun Legacy core with Unified-only overlay
        run: bash scripts/assemble_unified.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SlimefunUnified-CORE-EXTRAHEADS-PROTOTYPE-NOT-PRODUCTION
          path: build/output/SlimefunUnified-0.2.0-prototype.jar
          if-no-files-found: error
          retention-days: 7
